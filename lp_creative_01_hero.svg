<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10141C"/>
      <stop offset="100%" stop-color="#5A351E"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="80" y="120" width="920" height="760" rx="40" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.4)"/>
  <text x="120" y="250" fill="#fff" font-size="72" font-weight="700" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
    <tspan x="120" dy="0">わずか半日で、</tspan>
    <tspan x="120" dy="92">いつもの一杯を</tspan>
    <tspan x="120" dy="92">樽熟成の味わいへ。</tspan>
  </text>
  <text x="120" y="560" fill="#FFE1B4" font-size="46" font-weight="700" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
    <tspan x="120" dy="0">国産銘木で香りをハックする</tspan>
    <tspan x="120" dy="64">熟成キット「#酒ハック」</tspan>
  </text>
  <rect x="120" y="700" width="430" height="105" rx="24" fill="#DC5028"/>
  <text x="192" y="770" fill="#fff" font-size="44" font-weight="700">今すぐ購入</text>
  <rect x="580" y="700" width="380" height="105" rx="24" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="636" y="768" fill="#fff" font-size="36" font-weight="500">使い方を見る</text>
</svg>
