<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>SAKE HACK Offline Preview</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:#1c1c1c;padding:12px;border-radius:10px}
svg{width:100%;height:auto;background:#222;border-radius:8px}
small{color:#aaa}
</style>
</head>
<body>
<h1>オフラインプレビュー（サーバー不要）</h1>
<small>このファイルはダブルクリックで開けます。</small>
<h2>本番用3枚</h2>
<div class="grid">
<div class="card"><h3>Hero</h3>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10141C"/><stop offset="100%" stop-color="#5A351E"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#bg)"/><rect x="80" y="120" width="920" height="760" rx="40" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.4)"/><text x="120" y="250" fill="#fff" font-size="72" font-weight="700"><tspan x="120" dy="0">わずか半日で、</tspan><tspan x="120" dy="92">いつもの一杯を</tspan><tspan x="120" dy="92">樽熟成の味わいへ。</tspan></text></svg>
</div>
<div class="card"><h3>Features</h3>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#F5EEE4"/><text x="80" y="170" fill="#281C14" font-size="80" font-weight="700">3つの魅力</text></svg>
</div>
<div class="card"><h3>CTA</h3>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#1D1D1D"/><text x="80" y="260" fill="#fff" font-size="72" font-weight="700">あなたの「理想の一杯」を今日から。</text></svg>
</div>
</div>
<h2>分割（項目ごと）</h2>
<div class="grid">
<div class="card"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640"><rect width="1080" height="640" fill="#F5EEE4"/><text x="100" y="200" font-size="70" fill="#322316">01 12〜24時間で熟成風味</text></svg></div>
<div class="card"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640"><rect width="1080" height="640" fill="#F5EEE4"/><text x="100" y="200" font-size="70" fill="#322316">02 7種の国産銘木</text></svg></div>
<div class="card"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640"><rect width="1080" height="640" fill="#F5EEE4"/><text x="100" y="200" font-size="62" fill="#322316">03 林業応援にもつながる</text></svg></div>
</div>
</body></html>
